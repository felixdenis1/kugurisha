<html lang="rw">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="google-site-verification"
      content="3gKpOzqyC--DhjwHVs_4Q86-gSEwGqXubl0NWfwB9CI"
    />

    <!-- BROWSER TAB TITLE LOGO (FAVICON) -->
    <link

      href="/favicon.svg"
    />
    <link

    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- SEO META DESCRIPTIONS -->
    <meta
      name="description"
      content="Gura icyo ushaka. Gurisha icyo ufite. kugurisha.com ni urubuga rhuza abaguzi n'abagurisha mu Rwanda, ahasantu hantu hamwe kandi mu buryo bworoshye."
    />

    <!-- OPEN GRAPH FOR SOCIAL & SEARCH BRANDING -->
    <meta
      property="og:title"
      content="Kugurisha | urubuga ushyiraho ikintu cyose kikagurwa"
    />
    <meta
      property="og:description"
      content="Gura icyo ushaka. Gurisha icyo ufite kuri kugurisha.com."
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://www.kugurisha.com"
    />

    <title>Kugurisha | urubuga ushyiraho ikintu cyose kikagurwa</title>

    <!--
      Apply the saved theme BEFORE React loads.
      Light is now the default for first-time users.
      This prevents any theme flash on page load.
    -->
    <script>
      (() => {
        try {
          const savedTheme =
            localStorage.getItem("kugurisha-theme")

          const theme =
            savedTheme === "light" ||
            savedTheme === "dark"
              ? savedTheme
              : "light"

          document.documentElement.setAttribute(
            "data-theme",
            theme
          )

          document.documentElement.style.colorScheme =
            theme

          if (theme === "dark") {
            document.documentElement.classList.add("dark")
          } else {
            document.documentElement.classList.remove("dark")
          }
        } catch {
          document.documentElement.setAttribute(
            "data-theme",
            "light"
          )

          document.documentElement.style.colorScheme =
            "light"

          document.documentElement.classList.remove("dark")
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
