<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="description"
      content="KUGURISHA.COM — Isoko ryawe ryo mu Rwanda. Gura icyo ushaka, gurisha icyo ufite."
    />

    <title>Kugurisha</title>

    <!--
      Apply the saved theme BEFORE React loads.
      Light is now the default for first-time users.
      This prevents any theme flash on page load.
    -->
    <script>
      (() => {
        try {
          const savedTheme =
            localStorage.getItem("kugurisha-theme")

          const theme =
            savedTheme === "light" ||
            savedTheme === "dark"
              ? savedTheme
              : "light"

          document.documentElement.setAttribute(
            "data-theme",
            theme
          )

          document.documentElement.style.colorScheme =
            theme

          if (theme === "dark") {
            document.documentElement.classList.add("dark")
          } else {
            document.documentElement.classList.remove("dark")
          }
        } catch {
          document.documentElement.setAttribute(
            "data-theme",
            "light"
          )

          document.documentElement.style.colorScheme =
            "light"

          document.documentElement.classList.remove("dark")
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
