    <!-- SEO META DESCRIPTIONS -->

    />

    <!-- Schema.org Organization Logo (Updated to point to PNG) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "url": "https://www.kugurisha.com",
      "logo": "https://www.kugurisha.com/favicon.png"
    }
    </script>

    <title>Kugurisha | urubuga ushyiraho ikintu cyose kikagurwa</title>

    <!--
      Apply the saved theme BEFORE React loads.
      Light is now the default for first-time users.
      This prevents any theme flash on page load.
    -->
    <script>
      (() => {
        try {
          const savedTheme =
            localStorage.getItem("kugurisha-theme")

          const theme =
            savedTheme === "light" ||
            savedTheme === "dark"
              ? savedTheme
              : "light"

          document.documentElement.setAttribute(
            "data-theme",
            theme
          )

          document.documentElement.style.colorScheme =
            theme

          if (theme === "dark") {
            document.documentElement.classList.add("dark")
          } else {
            document.documentElement.classList.remove("dark")
          }
        } catch {
          document.documentElement.setAttribute(
            "data-theme",
            "light"
          )

          document.documentElement.style.colorScheme =
            "light"

          document.documentElement.classList.remove("dark")
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
