<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Elite Geometric Modernist Gradients -->
    <linearGradient id="kg-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73afc9" />
      <stop offset="50%" stop-color="#569ab5" />
      <stop offset="100%" stop-color="#36677b" />
    </linearGradient>

    <linearGradient id="kg-purple-indigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36677b" />
      <stop offset="50%" stop-color="#5b78c4" />
      <stop offset="100%" stop-color="#9d73c9" />
    </linearGradient>

    <linearGradient id="kg-vibrant-glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#73afc9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#36677b" stop-opacity="0.95" />
    </linearGradient>

    <filter id="kg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#36677b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background container for preview contrast -->
  <rect width="512" height="512" rx="112" fill="#0b131a" />

  <!-- Outer Geometric Interlocking Ring (Symbolizing Marketplace Exchange & Unity) -->
  <g filter="url(#kg-shadow)">
    <!-- Left Dynamic Fold (Representing Buying / Incoming) -->
    <path d="M 220 110 
             C 140 110, 100 150, 100 230 
             L 100 290 
             C 100 370, 140 410, 220 410 
             L 260 410 
             L 260 340 
             L 220 340 
             C 180 340, 160 320, 160 280 
             L 160 240 
             C 160 200, 180 180, 220 180 
             L 280 180 
             L 280 110 Z" fill="url(#kg-cyan-blue)" />

    <!-- Right Dynamic Fold (Representing Selling / Outgoing & Expansion) -->
    <path d="M 292 102 
             L 252 102 
             L 252 172 
             L 292 172 
             C 332 172, 352 192, 352 232 
             L 352 272 
             C 352 312, 332 332, 292 332 
             L 232 332 
             L 232 402 
             L 292 402 
             C 372 402, 412 362, 412 282 
             L 412 222 
             C 412 142, 372 102, 292 102 Z" fill="url(#kg-purple-indigo)" opacity="0.95" />

    <!-- Central Core Nexus Spark (Representing Rwanda's Heart & Fast Matching) -->
    <path d="M 256 196 
             L 282 244 
             L 330 270 
             L 282 296 
             L 256 344 
             L 230 296 
             L 182 270 
             L 230 244 Z" fill="url(#kg-vibrant-glow)" />
  </g>
</svg>