<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients, filters, and shadows -->
  <defs>
    <!-- Background Glow Effect (Optional subtle depth behind shapes) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Gradient: Vibrant Pinkish-Red to Orange/Yellow -->
    <linearGradient id="g-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A68" />
      <stop offset="45%" stop-color="#FF334B" />
      <stop offset="75%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFBA00" />
    </linearGradient>

    <!-- Overlay Gradient for Depth / Dimensionality on Key Notch -->
    <linearGradient id="notch-overlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6004C" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>

    <!-- Soft Drop Shadow for Overlapping Layers -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Main Stylized 'G' Loop with Key/Cross Bar -->
    <!-- Formed by a continuous thick smooth stroke/path representing the outer curve, inner loop, and crossbar -->
    <path fill="url(#g-gradient)" fill-rule="evenodd" d="
      M -15,-130 
      C 60,-130 125,-75 125,10 
      C 125,95 60,150 -25,150 
      C -95,150 -140,105 -140,30 
      C -140,-35 -95,-85 -35,-85 
      C -10,-85 10,-75 25,-60 
      L -5,-30 
      C -15,-42 -28,-48 -42,-48 
      C -75,-48 -98,-15 -98,30 
      C -98,75 -68,108 -20,108 
      C 35,108 82,68 82,10 
      C 82,-45 40,-88 -15,-88 
      L -15,-130 Z
    " />

    <!-- Upper Loop / Arc Accent (Top curve of the 'G') -->
    <path fill="url(#g-gradient)" filter="url(#drop-shadow)" d="
      M -20,-130
      C -85,-130 -145,-75 -145,0
      C -145,15 -138,30 -130,42
      C -125,20 -115,0 -98,-15
      C -75,-40 -40,-50 -10,-50
      L 15,-85
      C -25,-115 -10,-130 -20,-130 Z
    " opacity="0.15" />

    <!-- Integrated Key/Crossbar Feature -->
    <!-- Horizontal Crossbar extending to the right with key notches -->
    <g filter="url(#drop-shadow)">
      <!-- Central Horizontal Bar extending out of the G -->
      <path fill="url(#g-gradient)" d="
        M -20,-12 
        L 135,-12 
        C 146,-12 155,-3 155,8 
        C 155,19 146,28 135,28 
        L -20,28 
        Z
      " />

      <!-- Key Teeth / Vertical Cross Teeth (The 'Key' elements) -->
      <!-- First Vertical Notch (Downward) -->
      <path fill="url(#g-gradient)" d="
        M 65,28 
        L 65,75 
        C 65,83 72,90 80,90 
        C 88,90 95,83 95,75 
        L 95,28 
        Z
      " />

      <!-- Second Vertical Notch (Upward Accent) -->
      <path fill="url(#notch-overlay)" d="
        M 105,-12 
        L 105,-50 
        C 105,-58 112,-65 120,-65 
        C 128,-65 135,-58 135,-50 
        L 135,-12 
        Z
      " />
    </g>

    <!-- Inner Keyhole Accent (Negative space accent inside the G's center) -->
    <circle cx="-35" cy="10" r="14" fill="url(#g-gradient)" />
  </g>
</svg>